<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHIVE OS — Project Nexus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* ============================================
       VARIÁVEIS DE DESIGN — ARCHIVE OS
       ============================================ */
    :root {
      --bg-deep: #07070c;
      --bg-surface: #0c0c14;
      --bg-elevated: #12121e;
      --bg-card: #16162a;
      --gold: #c9a96e;
      --gold-dim: #8a7345;
      --gold-bright: #e8c878;
      --gold-glow: rgba(201, 169, 110, 0.15);
      --text-primary: #e8e0d4;
      --text-secondary: #9a8e7e;
      --text-muted: #5a5248;
      --accent-green: #4ade80;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --glass-bg: rgba(255, 255, 255, 0.025);
      --glass-border: rgba(201, 169, 110, 0.12);
      --glass-hover: rgba(255, 255, 255, 0.05);
      --sidebar-w: 256px;
      --topbar-h: 52px;
      --font-serif: 'Libre Caslon Text', Georgia, serif;
      --font-sans: 'Manrope', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'Courier New', monospace;
      --radius: 6px;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ============================================
       RESET & BASE
       ============================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-deep);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input { font-family: inherit; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    /* ============================================
       CAMADA AMBIENTAL — Luzes flutuantes + Scanlines
       ============================================ */
    .ambient {
      position: fixed; border-radius: 50%;
      filter: blur(100px); pointer-events: none; z-index: 0;
    }
    .ambient-1 {
      width: 500px; height: 500px; background: var(--gold);
      top: -200px; right: -150px; opacity: 0.07;
      animation: ambFloat1 22s ease-in-out infinite;
    }
    .ambient-2 {
      width: 350px; height: 350px; background: #1a3a2a;
      bottom: -100px; left: -80px; opacity: 0.12;
      animation: ambFloat2 28s ease-in-out infinite;
    }
    .ambient-3 {
      width: 250px; height: 250px; background: #2a1a3a;
      top: 40%; left: 30%; opacity: 0.06;
      animation: ambFloat3 18s ease-in-out infinite;
    }
    @keyframes ambFloat1 { 0%,100%{ transform: translate(0,0); } 50%{ transform: translate(-60px, 40px); } }
    @keyframes ambFloat2 { 0%,100%{ transform: translate(0,0); } 50%{ transform: translate(50px, -30px); } }
    @keyframes ambFloat3 { 0%,100%{ transform: translate(0,0); } 33%{ transform: translate(30px, -40px); } 66%{ transform: translate(-20px, 20px); } }

    #scanlines {
      position: fixed; inset: 0; z-index: 10000; pointer-events: none;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.025) 2px, rgba(0,0,0,0.025) 4px
      );
    }
    #scanlines::after {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.35) 100%);
    }

    @media (prefers-reduced-motion: reduce) {
      .ambient, .typing-cursor { animation: none !important; }
    }

    /* ============================================
       BOOT SCREEN
       ============================================ */
    #boot {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-deep);
      transition: opacity 0.6s ease;
    }
    #boot.fade-out { opacity: 0; pointer-events: none; }
    #boot-content { text-align: center; width: 90%; max-width: 560px; }
    #boot-logo {
      font-family: var(--font-mono); font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 700; letter-spacing: 0.35em; color: var(--gold);
      min-height: 1.2em; display: inline-block;
    }
    .typing-cursor {
      display: inline-block; width: 2px; height: 1em;
      background: var(--gold); margin-left: 4px;
      vertical-align: text-bottom;
      animation: cursorBlink 0.8s step-end infinite;
    }
    @keyframes cursorBlink { 0%,100%{ opacity: 1; } 50%{ opacity: 0; } }
    #boot-subtitle {
      font-family: var(--font-mono); font-size: 0.7rem;
      color: var(--text-muted); letter-spacing: 0.25em;
      margin-top: 12px; opacity: 0;
      transition: opacity 0.8s ease;
    }
    #boot-subtitle.visible { opacity: 1; }
    #boot-log {
      margin-top: 32px; text-align: left;
      font-family: var(--font-mono); font-size: 0.65rem;
      color: var(--text-muted); line-height: 1.8;
      max-height: 120px; overflow: hidden;
    }
    #boot-log .log-line { opacity: 0; transform: translateY(4px); transition: all 0.3s ease; }
    #boot-log .log-line.visible { opacity: 1; transform: translateY(0); }
    #boot-log .log-ok { color: var(--accent-green); }
    #boot-progress-wrap {
      margin-top: 24px; height: 2px; background: rgba(255,255,255,0.05);
      border-radius: 2px; overflow: hidden; opacity: 0;
      transition: opacity 0.5s ease;
    }
    #boot-progress-wrap.visible { opacity: 1; }
    #boot-progress-bar {
      height: 100%; width: 0%; background: var(--gold);
      transition: width 0.4s ease;
      box-shadow: 0 0 8px var(--gold-glow);
    }

    /* ============================================
       ADMIT SCREEN (Login)
       ============================================ */
    #admit {
      position: fixed; inset: 0; z-index: 90;
      display: none; align-items: center; justify-content: center;
      background: var(--bg-deep);
      opacity: 0; transition: opacity 0.8s ease;
    }
    #admit.visible { display: flex; }
    #admit.show { opacity: 1; }
    #admit-card {
      width: 90%; max-width: 420px; padding: 48px 40px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 12px; backdrop-filter: blur(20px);
      box-shadow: 0 0 80px rgba(201,169,110,0.04);
      transform: translateY(20px); transition: transform 0.6s ease;
    }
    #admit.show #admit-card { transform: translateY(0); }
    #admit-header { text-align: center; margin-bottom: 36px; }
    #admit-header i {
      font-size: 1.8rem; color: var(--gold); margin-bottom: 16px;
      display: block; filter: drop-shadow(0 0 12px var(--gold-glow));
    }
    #admit-header h1 {
      font-family: var(--font-mono); font-size: 1.1rem;
      letter-spacing: 0.2em; color: var(--text-primary);
      font-weight: 500;
    }
    #admit-header p {
      font-size: 0.8rem; color: var(--text-muted); margin-top: 8px;
    }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block; font-family: var(--font-mono);
      font-size: 0.65rem; letter-spacing: 0.15em;
      color: var(--text-secondary); margin-bottom: 8px;
      text-transform: uppercase;
    }
    .form-group input {
      width: 100%; padding: 12px 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius); color: var(--text-primary);
      font-size: 0.95rem; transition: all var(--transition);
    }
    .form-group input::placeholder { color: var(--text-muted); }
    .form-group input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--gold-glow);
      background: rgba(255,255,255,0.04);
    }
    #admit-error {
      font-family: var(--font-mono); font-size: 0.7rem;
      color: var(--accent-red); min-height: 1.4em; margin-bottom: 8px;
      transition: opacity 0.3s ease;
    }
    #admit-btn {
      width: 100%; padding: 14px; margin-top: 8px;
      background: linear-gradient(135deg, var(--gold-dim), var(--gold));
      color: var(--bg-deep); font-family: var(--font-mono);
      font-size: 0.8rem; font-weight: 700;
      letter-spacing: 0.15em; border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: all var(--transition);
    }
    #admit-btn:hover {
      background: linear-gradient(135deg, var(--gold), var(--gold-bright));
      box-shadow: 0 4px 24px rgba(201,169,110,0.3);
      transform: translateY(-1px);
    }
    #admit-btn:active { transform: translateY(0); }
    #admit-btn i { font-size: 0.75rem; transition: transform var(--transition); }
    #admit-btn:hover i { transform: translateX(3px); }

    /* ============================================
       SHELL — Layout Principal
       ============================================ */
    #shell {
      position: fixed; inset: 0; z-index: 50;
      display: none; opacity: 0; transition: opacity 0.6s ease;
    }
    #shell.visible { display: flex; }
    #shell.show { opacity: 1; }

    /* -- Sidebar -- */
    #sidebar {
      width: var(--sidebar-w); height: 100%;
      background: var(--bg-surface);
      border-right: 1px solid rgba(255,255,255,0.04);
      display: flex; flex-direction: column;
      flex-shrink: 0; z-index: 10;
      transition: transform var(--transition);
    }
    #sidebar-brand {
      height: var(--topbar-h); display: flex; align-items: center;
      padding: 0 20px; gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .brand-icon {
      width: 30px; height: 30px; display: flex; align-items: center;
      justify-content: center; font-family: var(--font-serif);
      font-size: 1.1rem; font-weight: 700; color: var(--gold);
      border: 1px solid var(--glass-border); border-radius: 4px;
      background: var(--gold-glow);
    }
    .brand-text {
      font-family: var(--font-mono); font-size: 0.75rem;
      letter-spacing: 0.2em; color: var(--text-secondary);
      font-weight: 500;
    }
    #sidebar-nav {
      flex: 1; overflow-y: auto; padding: 12px 0;
      scrollbar-width: thin; scrollbar-color: var(--bg-elevated) transparent;
    }
    #sidebar-nav::-webkit-scrollbar { width: 4px; }
    #sidebar-nav::-webkit-scrollbar-thumb { background: var(--bg-elevated); border-radius: 4px; }
    .nav-section { margin-bottom: 8px; }
    .nav-section-label {
      font-family: var(--font-mono); font-size: 0.55rem;
      letter-spacing: 0.2em; color: var(--text-muted);
      padding: 8px 20px 4px; text-transform: uppercase;
    }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 20px; margin: 1px 8px;
      border-radius: var(--radius); font-size: 0.82rem;
      color: var(--text-secondary); cursor: pointer;
      border-left: 2px solid transparent;
      transition: all var(--transition);
    }
    .nav-item i { width: 18px; text-align: center; font-size: 0.8rem; }
    .nav-item:hover {
      background: var(--glass-hover); color: var(--text-primary);
    }
    .nav-item.active {
      background: var(--gold-glow);
      color: var(--gold-bright);
      border-left-color: var(--gold);
    }
    #sidebar-footer {
      padding: 12px; border-top: 1px solid rgba(255,255,255,0.04);
    }
    #logout-btn {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 10px 12px; border-radius: var(--radius);
      font-size: 0.8rem; color: var(--text-muted);
      transition: all var(--transition);
    }
    #logout-btn i { width: 18px; text-align: center; }
    #logout-btn:hover { background: rgba(239,68,68,0.08); color: var(--accent-red); }

    /* -- Workspace -- */
    #workspace {
      flex: 1; display: flex; flex-direction: column;
      min-width: 0; position: relative;
    }

    /* -- Topbar -- */
    #topbar {
      height: var(--topbar-h); display: flex; align-items: center;
      padding: 0 24px; gap: 16px;
      background: var(--bg-surface);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      flex-shrink: 0; z-index: 5;
    }
    #menu-toggle {
      display: none; width: 36px; height: 36px;
      align-items: center; justify-content: center;
      border-radius: var(--radius); font-size: 1rem;
      color: var(--text-secondary); transition: all var(--transition);
    }
    #menu-toggle:hover { background: var(--glass-hover); color: var(--text-primary); }
    #topbar-title {
      font-family: var(--font-mono); font-size: 0.75rem;
      letter-spacing: 0.1em; color: var(--text-secondary);
      flex: 1;
    }
    #topbar-right {
      display: flex; align-items: center; gap: 20px;
    }
    #topbar-clock {
      font-family: var(--font-mono); font-size: 0.7rem;
      color: var(--text-muted); letter-spacing: 0.05em;
    }
    #topbar-status {
      display: flex; align-items: center; gap: 6px;
      font-family: var(--font-mono); font-size: 0.6rem;
      letter-spacing: 0.1em; color: var(--text-muted);
    }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent-red);
    }
    .status-dot.online {
      background: var(--accent-green);
      box-shadow: 0 0 6px rgba(74,222,128,0.5);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100%{ opacity: 1; } 50%{ opacity: 0.5; }
    }
    #topbar-director {
      font-family: var(--font-mono); font-size: 0.65rem;
      color: var(--text-secondary); letter-spacing: 0.05em;
      padding-left: 16px; border-left: 1px solid rgba(255,255,255,0.06);
    }

    /* -- Frame Container -- */
    #frame-container {
      flex: 1; position: relative; overflow: hidden;
      background: var(--bg-deep);
    }
    #app-frame {
      width: 100%; height: 100%; border: none;
      background: var(--bg-deep);
      display: none;
    }
    #home-dashboard {
      position: absolute; inset: 0; overflow-y: auto;
      padding: 32px; display: block;
      scrollbar-width: thin; scrollbar-color: var(--bg-elevated) transparent;
    }
    #home-dashboard::-webkit-scrollbar { width: 6px; }
    #home-dashboard::-webkit-scrollbar-thumb { background: var(--bg-elevated); border-radius: 4px; }
    #frame-loading {
      position: absolute; inset: 0;
      display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
      background: var(--bg-deep); z-index: 2;
      font-family: var(--font-mono); font-size: 0.75rem;
      color: var(--text-muted); letter-spacing: 0.1em;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid rgba(255,255,255,0.06);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* -- Home Dashboard -- */
    .dash-welcome {
      margin-bottom: 32px;
    }
    .dash-welcome h2 {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 400; color: var(--text-primary); line-height: 1.3;
    }
    .dash-welcome h2 span { color: var(--gold); }
    .dash-welcome p {
      font-size: 0.85rem; color: var(--text-muted); margin-top: 6px;
    }
    .dash-welcome-line {
      width: 60px; height: 1px; background: var(--gold-dim);
      margin-top: 16px; opacity: 0.5;
    }
    .dash-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px; margin-bottom: 32px;
    }
    .stat-card {
      padding: 20px; background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 8px; transition: all var(--transition);
    }
    .stat-card:hover {
      background: var(--glass-hover);
      border-color: rgba(201,169,110,0.2);
      transform: translateY(-2px);
    }
    .stat-card .stat-icon {
      font-size: 0.9rem; color: var(--gold-dim); margin-bottom: 12px;
    }
    .stat-card .stat-value {
      font-family: var(--font-mono); font-size: 1.8rem;
      font-weight: 700; color: var(--text-primary); line-height: 1;
    }
    .stat-card .stat-label {
      font-size: 0.7rem; color: var(--text-muted);
      margin-top: 6px; letter-spacing: 0.05em;
    }
    .dash-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .dash-panel {
      padding: 24px; background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
    }
    .dash-panel-title {
      font-family: var(--font-mono); font-size: 0.6rem;
      letter-spacing: 0.2em; color: var(--text-muted);
      text-transform: uppercase; margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .dash-panel-title .priority-tag {
      font-size: 0.55rem; padding: 2px 8px;
      background: rgba(239,68,68,0.12); color: var(--accent-red);
      border-radius: 3px; letter-spacing: 0.1em; font-weight: 600;
    }
    .mission-name {
      font-family: var(--font-serif); font-size: 1.25rem;
      color: var(--text-primary); margin-bottom: 12px;
    }
    .mission-detail {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.78rem; color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .mission-detail i { width: 14px; color: var(--text-muted); font-size: 0.7rem; }
    .mission-progress-bar {
      margin-top: 16px; height: 3px; background: rgba(255,255,255,0.05);
      border-radius: 3px; overflow: hidden;
    }
    .mission-progress-fill {
      height: 100%; background: var(--gold); border-radius: 3px;
      transition: width 1s ease;
    }
    .mission-btn {
      margin-top: 16px; padding: 8px 20px;
      background: var(--gold-glow); border: 1px solid var(--glass-border);
      border-radius: var(--radius); font-family: var(--font-mono);
      font-size: 0.7rem; letter-spacing: 0.1em; color: var(--gold);
      transition: all var(--transition);
    }
    .mission-btn:hover {
      background: rgba(201,169,110,0.2);
      border-color: var(--gold-dim);
    }
    .activity-item {
      display: flex; gap: 12px; padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      font-size: 0.78rem;
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-time {
      font-family: var(--font-mono); font-size: 0.65rem;
      color: var(--text-muted); white-space: nowrap; min-width: 42px;
    }
    .activity-text { color: var(--text-secondary); line-height: 1.5; }

    /* -- Toast -- */
    #toast-container {
      position: fixed; bottom: 24px; right: 24px;
      z-index: 20000; display: flex; flex-direction: column-reverse; gap: 8px;
    }
    .toast {
      padding: 12px 20px; border-radius: var(--radius);
      font-family: var(--font-mono); font-size: 0.72rem;
      letter-spacing: 0.03em; display: flex; align-items: center; gap: 10px;
      background: var(--bg-elevated); border: 1px solid rgba(255,255,255,0.06);
      color: var(--text-primary); box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transform: translateX(120%); transition: transform 0.35s ease;
      max-width: 360px;
    }
    .toast.show { transform: translateX(0); }
    .toast.success i { color: var(--accent-green); }
    .toast.error i { color: var(--accent-red); }
    .toast.info i { color: var(--gold); }
    .toast-close {
      margin-left: auto; color: var(--text-muted);
      font-size: 0.7rem; padding: 4px;
      transition: color var(--transition);
    }
    .toast-close:hover { color: var(--text-primary); }

    /* ============================================
       RESPONSIVO
       ============================================ */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed; left: 0; top: 0; z-index: 100;
        transform: translateX(-100%);
      }
      #sidebar.open { transform: translateX(0); }
      #sidebar-overlay {
        position: fixed; inset: 0; z-index: 99;
        background: rgba(0,0,0,0.6); display: none;
      }
      #sidebar-overlay.open { display: block; }
      #menu-toggle { display: flex; }
      .dash-grid { grid-template-columns: 1fr; }
      #home-dashboard { padding: 20px; }
      #topbar-director { display: none; }
    }
    @media (max-width: 480px) {
      .dash-stats { grid-template-columns: 1fr 1fr; gap: 10px; }
      .stat-card { padding: 14px; }
      .stat-card .stat-value { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <!-- Camadas ambientais -->
  <div class="ambient ambient-1"></div>
  <div class="ambient ambient-2"></div>
  <div class="ambient ambient-3"></div>
  <div id="scanlines" aria-hidden="true"></div>

  <!-- ========================================
       TELA 1: BOOT
       ======================================== -->
  <div id="boot" role="status" aria-label="Inicializando o sistema">
    <div id="boot-content">
      <div id="boot-logo"><span id="logo-text"></span><span class="typing-cursor" id="boot-cursor"></span></div>
      <div id="boot-subtitle">SISTEMA OPERACIONAL v3.7.1</div>
      <div id="boot-log"></div>
      <div id="boot-progress-wrap"><div id="boot-progress-bar"></div></div>
    </div>
  </div>

  <!-- ========================================
       TELA 2: ADMIT (Login)
       ======================================== -->
  <div id="admit" role="dialog" aria-label="Tela de autenticação">
    <div id="admit-card">
      <div id="admit-header">
        <i class="fas fa-shield-halved"></i>
        <h1>ADMITIR ACESSO</h1>
        <p>Identificacao requerida para entrar no Archive OS</p>
      </div>
      <form id="admit-form" novalidate>
        <div class="form-group">
          <label for="dir-name">Nome do Diretor</label>
          <input type="text" id="dir-name" placeholder="Ex: Alexandre Moreira" autocomplete="name" required>
        </div>
        <div class="form-group">
          <label for="dir-codename">Codinome de Operacao</label>
          <input type="text" id="dir-codename" placeholder="Ex: CIPHER" autocomplete="off" required>
        </div>
        <div id="admit-error" role="alert"></div>
        <button type="submit" id="admit-btn">
          <span>INICIAR SESSAO</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- ========================================
       TELA 3: SHELL (App Principal)
       ======================================== -->
  <div id="shell">
    <!-- Overlay mobile -->
    <div id="sidebar-overlay"></div>

    <!-- Sidebar -->
    <nav id="sidebar" aria-label="Navegacao principal">
      <div id="sidebar-brand">
        <span class="brand-icon">A</span>
        <span class="brand-text">ARCHIVE</span>
      </div>
      <div id="sidebar-nav" role="navigation"></div>
      <div id="sidebar-footer">
        <button id="logout-btn" aria-label="Encerrar sessao">
          <i class="fas fa-power-off"></i>
          <span>Encerrar Sessao</span>
        </button>
      </div>
    </nav>

    <!-- Workspace -->
    <main id="workspace">
      <header id="topbar">
        <button id="menu-toggle" aria-label="Abrir menu">
          <i class="fas fa-bars"></i>
        </button>
        <div id="topbar-title">TERMINAL ALPHA</div>
        <div id="topbar-right">
          <div id="topbar-clock" aria-live="polite">--:--:--</div>
          <div id="topbar-status">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">VERIFICANDO</span>
          </div>
          <div id="topbar-director"></div>
        </div>
      </header>

      <div id="frame-container">
        <!-- Dashboard inicial (visivel por padrao) -->
        <div id="home-dashboard"></div>
        <!-- Iframe para as telas individuais -->
        <iframe id="app-frame" src="about:blank" title="Modulo do Archive OS"></iframe>
        <!-- Overlay de carregamento -->
        <div id="frame-loading">
          <div class="spinner"></div>
          <span>Carregando modulo...</span>
        </div>
      </div>
    </main>
  </div>

  <!-- Toasts -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- ========================================
       JAVASCRIPT
       ======================================== -->
  <script>
  (function() {
    'use strict';

    /* ==============================================
       CONFIGURACAO DE NAVEGACAO
       Ajuste os caminhos dos arquivos conforme necessario.
       O campo "file" aponta para telas-individuais/.
       Se "file" estiver ausente, abre o dashboard.
       ============================================== */
    var NAV_CONFIG = [
      {
        group: 'COMANDO',
        items: [
          { id: 'home',    icon: 'fa-terminal',       label: 'Terminal Alpha' },
          { id: 'globe',   icon: 'fa-earth-americas', label: 'Globo Interativo',     file: 'telas-individuais/05-globo.html' }
        ]
      },
      {
        group: 'OPERACOES',
        items: [
          { id: 'missions',  icon: 'fa-crosshairs',      label: 'Missoes Ativas',      file: 'telas-individuais/07-briefing.html' },
          { id: 'evidence',  icon: 'fa-diagram-project',  label: 'Teia de Evidencias',  file: 'telas-individuais/09-teia.html' }
        ]
      },
      {
        group: 'ACERVO',
        items: [
          { id: 'database', icon: 'fa-database',   label: 'Banco de Dados',     file: 'telas-individuais/08-banco-dados.html' },
          { id: 'museum',   icon: 'fa-landmark',   label: 'Museu da Archive',   file: 'telas-individuais/15-museu.html' },
          { id: 'library',  icon: 'fa-book-open',  label: 'Biblioteca Central',  file: 'telas-individuais/16-biblioteca.html' }
        ]
      },
      {
        group: 'AGENTE',
        items: [
          { id: 'passport', icon: 'fa-id-card',    label: 'Passaporte',         file: 'telas-individuais/11-passaporte.html' },
          { id: 'journal',  icon: 'fa-pen-nib',    label: 'Diario de Bordo',    file: 'telas-individuais/12-diario.html' },
          { id: 'progress', icon: 'fa-chart-line', label: 'Progressao',         file: 'telas-individuais/17-progressao.html' }
        ]
      },
      {
        group: 'INSTALACOES',
        items: [
          { id: 'hq',       icon: 'fa-building',    label: 'Status da Sede',     file: 'telas-individuais/13-status-sede.html' },
          { id: 'director', icon: 'fa-user-shield', label: 'Sala do Diretor',    file: 'telas-individuais/18-sala-diretor.html' },
          { id: 'atrium',   icon: 'fa-archway',     label: 'HQ Atrium',          file: 'telas-individuais/19-hq-atrium.html' }
        ]
      },
      {
        group: 'SISTEMA',
        items: [
          { id: 'settings', icon: 'fa-gear', label: 'Configuracoes', file: 'telas-individuais/04-config.html' }
        ]
      }
    ];

    /* Dados do dashboard (fallback local) */
    var DASH_STATS = {
      missions: 3, artifacts: 47, agents: 12, integrity: 94.7
    };
    var DASH_MISSION = {
      name: 'OPERACAO MERIDIAN', location: 'Cairo, Egito',
      priority: 'ALTA', phase: 2, totalPhases: 4, progress: 50
    };
    var DASH_ACTIVITY = [
      { time: '14:32', text: 'Agente ORACLE reportou posicao em Cairo' },
      { time: '14:15', text: 'Artefato #47 adicionado ao acervo digital' },
      { time: '13:58', text: 'Analise de evidencias da Missao Typhon atualizada' },
      { time: '13:40', text: 'Tunel criptografado reestabelecido com nodo Londres' },
      { time: '13:22', text: 'Alerta de movimentacao suspeita em Istanbul' },
      { time: '12:50', text: 'Backup do banco de dados concluido com sucesso' }
    ];

    /* ==============================================
       ESTADO
       ============================================== */
    var STATE_KEY = 'nexus_state_v1';
    var currentNavId = 'home';
    var clockInterval = null;
    var loadTimeout = null;

    /* ==============================================
       UTILITARIOS
       ============================================== */
    function getState() {
      try { return JSON.parse(localStorage.getItem(STATE_KEY)) || null; }
      catch(e) { return null; }
    }
    function setState(obj) {
      var current = getState() || {};
      var merged = Object.assign({}, current, obj);
      localStorage.setItem(STATE_KEY, JSON.stringify(merged));
    }
    function clearState() {
      localStorage.removeItem(STATE_KEY);
    }

    /* Aguarda um tempo (ms) */
    function wait(ms) {
      return new Promise(function(resolve) { setTimeout(resolve, ms); });
    }

    /* ==============================================
       TOAST NOTIFICATIONS
       ============================================== */
    function showToast(message, type) {
      type = type || 'info';
      var icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
      var container = document.getElementById('toast-container');
      var toast = document.createElement('div');
      toast.className = 'toast ' + type;
      toast.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i>' +
        '<span>' + message + '</span>' +
        '<button class="toast-close" aria-label="Fechar"><i class="fas fa-xmark"></i></button>';
      container.appendChild(toast);
      /* Forcar reflow para a animacao funcionar */
      toast.offsetHeight;
      toast.classList.add('show');
      var closeBtn = toast.querySelector('.toast-close');
      function dismiss() {
        toast.classList.remove('show');
        setTimeout(function() { toast.remove(); }, 400);
      }
      closeBtn.addEventListener('click', dismiss);
      setTimeout(dismiss, 4500);
    }

    /* ==============================================
       BOOT SEQUENCE
       ============================================== */
    async function runBoot(fast) {
      var bootEl = document.getElementById('boot');
      var logoText = document.getElementById('logo-text');
      var cursor = document.getElementById('boot-cursor');
      var subtitle = document.getElementById('boot-subtitle');
      var logEl = document.getElementById('boot-log');
      var progressWrap = document.getElementById('boot-progress-wrap');
      var progressBar = document.getElementById('boot-progress-bar');
      var text = 'ARCHIVE';
      var baseDelay = fast ? 30 : 90;
      var logLines = [
        'INICIALIZANDO NUCLEO ARCHIVE...',
        'CARREGANDO MODULOS CRIPTOGRAFICOS...',
        'ESTABELECENDO TUNEL SEGURO...',
        'VERIFICANDO INTEGRIDADE DOS DADOS...',
        'CONECTANDO REDE ARCHIVE-NET...'
      ];

      /* Fase 1: Digitar o logo */
      for (var i = 0; i < text.length; i++) {
        logoText.textContent += text[i];
        await wait(baseDelay);
      }

      await wait(fast ? 200 : 500);
      subtitle.classList.add('visible');

      /* Fase 2: Log de inicializacao + barra de progresso */
      await wait(fast ? 100 : 400);
      progressWrap.classList.add('visible');

      for (var j = 0; j < logLines.length; j++) {
        var line = document.createElement('div');
        line.className = 'log-line';
        line.textContent = logLines[j];
        logEl.appendChild(line);
        await wait(50);
        line.classList.add('visible');
        progressBar.style.width = ((j + 1) / logLines.length * 100) + '%';
        await wait(fast ? 80 : 350);
      }

      /* Linha final */
      await wait(fast ? 80 : 300);
      var okLine = document.createElement('div');
      okLine.className = 'log-line log-ok';
      okLine.textContent = 'SISTEMA OPERACIONAL PRONTO';
      logEl.appendChild(okLine);
      await wait(50);
      okLine.classList.add('visible');

      await wait(fast ? 300 : 800);

      /* Fase 3: Transicao */
      bootEl.classList.add('fade-out');
      await wait(600);
      bootEl.style.display = 'none';
    }

    /* ==============================================
       ADMIT SCREEN (Login)
       ============================================== */
    function showAdmit() {
      var admit = document.getElementById('admit');
      admit.style.display = 'flex';
      /* Forcar reflow */
      admit.offsetHeight;
      admit.classList.add('visible', 'show');
      document.getElementById('dir-name').focus();
    }

    function hideAdmit() {
      var admit = document.getElementById('admit');
      admit.classList.remove('show');
      setTimeout(function() {
        admit.style.display = 'none';
        admit.classList.remove('visible');
      }, 600);
    }

    function setupAdmitForm() {
      var form = document.getElementById('admit-form');
      var nameInput = document.getElementById('dir-name');
      var codeInput = document.getElementById('dir-codename');
      var errorEl = document.getElementById('admit-error');

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var name = nameInput.value.trim();
        var codename = codeInput.value.trim().toUpperCase();
        errorEl.textContent = '';

        if (!name) { errorEl.textContent = 'Nome do Diretor e obrigatorio.'; nameInput.focus(); return; }
        if (!codename) { errorEl.textContent = 'Codinome de Operacao e obrigatorio.'; codeInput.focus(); return; }
        if (codename.length < 3) { errorEl.textContent = 'Codinome deve ter ao menos 3 caracteres.'; codeInput.focus(); return; }

        /* Salvar estado */
        setState({
          director: { name: name, codename: codename },
          loggedInAt: new Date().toISOString(),
          stats: DASH_STATS
        });

        hideAdmit();
        setTimeout(function() { enterShell(); }, 300);
      });
    }

    /* ==============================================
       SHELL — Entrada e Construcao
       ============================================== */
    function enterShell() {
      var shell = document.getElementById('shell');
      shell.style.display = 'flex';
      shell.offsetHeight;
      shell.classList.add('visible', 'show');

      var state = getState();
      buildNavigation();
      buildDashboard(state);
      showHome();
      startClock();
      updateTopbarDirector(state);
      checkAPIStatus();
      showToast('Sessao iniciada com sucesso', 'success');
    }

    function buildNavigation() {
      var nav = document.getElementById('sidebar-nav');
      nav.innerHTML = '';

      NAV_CONFIG.forEach(function(section) {
        var groupDiv = document.createElement('div');
        groupDiv.className = 'nav-section';

        var label = document.createElement('div');
        label.className = 'nav-section-label';
        label.textContent = section.group;
        groupDiv.appendChild(label);

        section.items.forEach(function(item) {
          var a = document.createElement('a');
          a.className = 'nav-item' + (item.id === 'home' ? ' active' : '');
          a.setAttribute('data-nav-id', item.id);
          a.setAttribute('role', 'button');
          a.setAttribute('tabindex', '0');
          a.innerHTML = '<i class="fas ' + item.icon + '"></i><span>' + item.label + '</span>';
          a.addEventListener('click', function() { navigateTo(item); });
          a.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navigateTo(item); }
          });
          groupDiv.appendChild(a);
        });

        nav.appendChild(groupDiv);
      });
    }

    function navigateTo(item) {
      /* Atualizar active state na sidebar */
      var allItems = document.querySelectorAll('.nav-item');
      allItems.forEach(function(el) { el.classList.remove('active'); });
      var target = document.querySelector('[data-nav-id="' + item.id + '"]');
      if (target) target.classList.add('active');

      /* Atualizar titulo do topbar */
      document.getElementById('topbar-title').textContent = item.label.toUpperCase();

      /* Fechar sidebar no mobile */
      closeSidebar();

      if (!item.file) {
        showHome();
      } else {
        loadScreen(item.file, item.label);
      }
      currentNavId = item.id;
    }

    function showHome() {
      var frame = document.getElementById('app-frame');
      var dashboard = document.getElementById('home-dashboard');
      var loading = document.getElementById('frame-loading');
      frame.style.display = 'none';
      frame.src = 'about:blank';
      loading.style.display = 'none';
      dashboard.style.display = 'block';
      if (loadTimeout) { clearTimeout(loadTimeout); loadTimeout = null; }
    }

    function loadScreen(file, label) {
      var frame = document.getElementById('app-frame');
      var dashboard = document.getElementById('home-dashboard');
      var loading = document.getElementById('frame-loading');

      dashboard.style.display = 'none';
      loading.style.display = 'flex';
      frame.style.display = 'block';

      function onReady() {
        loading.style.display = 'none';
        if (loadTimeout) { clearTimeout(loadTimeout); loadTimeout = null; }
      }

      frame.onload = onReady;
      frame.onerror = function() {
        onReady();
        showToast('Falha ao carregar: ' + (label || file), 'error');
      };

      /* Timeout de seguranca (10s) */
      loadTimeout = setTimeout(function() {
        loading.style.display = 'none';
      }, 10000);

      frame.src = file;
    }

    /* ==============================================
       DASHBOARD
       ============================================== */
    function buildDashboard(state) {
      var dash = document.getElementById('home-dashboard');
      var directorName = (state && state.director) ? state.director.name : 'Diretor';
      var stats = (state && state.stats) ? state.stats : DASH_STATS;
      var mission = DASH_MISSION;

      dash.innerHTML =
        '<div class="dash-welcome">' +
          '<h2>Bem-vindo de volta, <span>' + escapeHTML(directorName) + '</span></h2>' +
          '<p>Painel de comando da Archive. Todos os sistemas operacionais.</p>' +
          '<div class="dash-welcome-line"></div>' +
        '</div>' +
        '<div class="dash-stats">' +
          buildStatCard('fa-crosshairs', stats.missions, 'Missoes Ativas') +
          buildStatCard('fa-gem', stats.artifacts, 'Artefatos Catalogados') +
          buildStatCard('fa-user-secret', stats.agents, 'Agentes em Campo') +
          buildStatCard('fa-signal', stats.integrity + '%', 'Integridade da Rede') +
        '</div>' +
        '<div class="dash-grid">' +
          '<div class="dash-panel">' +
            '<div class="dash-panel-title">MISSAO EM ANDAMENTO <span class="priority-tag">' + mission.priority + '</span></div>' +
            '<div class="mission-name">' + mission.name + '</div>' +
            '<div class="mission-detail"><i class="fas fa-location-dot"></i>' + mission.location + '</div>' +
            '<div class="mission-detail"><i class="fas fa-layer-group"></i>Fase ' + mission.phase + ' de ' + mission.totalPhases + '</div>' +
            '<div class="mission-detail"><i class="fas fa-clock"></i>Atualizado ha 12 min</div>' +
            '<div class="mission-progress-bar"><div class="mission-progress-fill" style="width:0%"></div></div>' +
            '<button class="mission-btn" data-nav-target="missions">ACESSAR MISSAO</button>' +
          '</div>' +
          '<div class="dash-panel">' +
            '<div class="dash-panel-title">ATIVIDADE RECENTE</div>' +
            buildActivityFeed(DASH_ACTIVITY) +
          '</div>' +
        '</div>';

      /* Animar barra de progresso da missao */
      setTimeout(function() {
        var fill = dash.querySelector('.mission-progress-fill');
        if (fill) fill.style.width = mission.progress + '%';
      }, 300);

      /* Botao de acessar missao */
      var missionBtn = dash.querySelector('[data-nav-target="missions"]');
      if (missionBtn) {
        missionBtn.addEventListener('click', function() {
          var missionsItem = findNavItem('missions');
          if (missionsItem) navigateTo(missionsItem);
        });
      }
    }

    function buildStatCard(icon, value, label) {
      return '<div class="stat-card">' +
        '<div class="stat-icon"><i class="fas ' + icon + '"></i></div>' +
        '<div class="stat-value">' + value + '</div>' +
        '<div class="stat-label">' + label + '</div>' +
      '</div>';
    }

    function buildActivityFeed(items) {
      var html = '';
      items.forEach(function(item) {
        html += '<div class="activity-item">' +
          '<span class="activity-time">' + item.time + '</span>' +
          '<span class="activity-text">' + item.text + '</span>' +
        '</div>';
      });
      return html;
    }

    function findNavItem(id) {
      for (var i = 0; i < NAV_CONFIG.length; i++) {
        for (var j = 0; j < NAV_CONFIG[i].items.length; j++) {
          if (NAV_CONFIG[i].items[j].id === id) return NAV_CONFIG[i].items[j];
        }
      }
      return null;
    }

    function escapeHTML(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    /* ==============================================
       TOPBAR — Relogio, Status, Diretor
       ============================================== */
    function startClock() {
      if (clockInterval) clearInterval(clockInterval);
      function tick() {
        var now = new Date();
        var h = String(now.getHours()).padStart(2, '0');
        var m = String(now.getMinutes()).padStart(2, '0');
        var s = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('topbar-clock').textContent = h + ':' + m + ':' + s;
      }
      tick();
      clockInterval = setInterval(tick, 1000);
    }

    function updateTopbarDirector(state) {
      var el = document.getElementById('topbar-director');
      if (state && state.director) {
        el.textContent = state.director.codename;
      }
    }

    async function checkAPIStatus() {
      var dot = document.getElementById('status-dot');
      var text = document.getElementById('status-text');
      try {
        var res = await fetch('http://localhost:3000/api/health', {
          signal: AbortSignal.timeout(3000)
        });
        if (res.ok) {
          dot.classList.add('online');
          text.textContent = 'ONLINE';
        } else { throw new Error('bad status'); }
      } catch(e) {
        dot.classList.remove('online');
        text.textContent = 'OFFLINE';
      }
    }

    /* ==============================================
       SIDEBAR MOBILE
       ============================================== */
    function setupMobileSidebar() {
      var toggle = document.getElementById('menu-toggle');
      var sidebar = document.getElementById('sidebar');
      var overlay = document.getElementById('sidebar-overlay');

      toggle.addEventListener('click', function() {
        sidebar.classList.add('open');
        overlay.classList.add('open');
      });
      overlay.addEventListener('click', closeSidebar);
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebar-overlay').classList.remove('open');
    }

    /* ==============================================
       LOGOUT
       ============================================== */
    function setupLogout() {
      document.getElementById('logout-btn').addEventListener('click', function() {
        clearState();
        if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
        /* Resetar visual */
        var shell = document.getElementById('shell');
        shell.classList.remove('show');
        setTimeout(function() {
          shell.style.display = 'none';
          shell.classList.remove('visible');
          /* Resetar boot para poder repetir */
          var boot = document.getElementById('boot');
          boot.style.display = 'flex';
          boot.classList.remove('fade-out');
          document.getElementById('logo-text').textContent = '';
          document.getElementById('boot-subtitle').classList.remove('visible');
          document.getElementById('boot-log').innerHTML = '';
          document.getElementById('boot-progress-bar').style.width = '0%';
          document.getElementById('boot-progress-wrap').classList.remove('visible');
          /* Resetar admit */
          document.getElementById('admit-form').reset();
          document.getElementById('admit-error').textContent = '';
          /* Reiniciar fluxo */
          init();
        }, 400);
      });
    }

    /* ==============================================
       INICIALIZACAO PRINCIPAL
       ============================================== */
    async function init() {
      var state = getState();
      var alreadyLoggedIn = !!(state && state.director && state.director.name);

      try {
        /* Boot sequence — mais rapido se ja logado */
        await runBoot(alreadyLoggedIn);

        if (alreadyLoggedIn) {
          /* Pular admit, ir direto pro shell */
          enterShell();
        } else {
          /* Mostrar tela de login */
          showAdmit();
        }
      } catch(err) {
        /* Failsafe absoluto: se qualquer coisa falhar no boot,
           forcar a tela de admit direta */
        console.error('[ARCHIVE OS] Erro no boot:', err);
        document.getElementById('boot').style.display = 'none';
        showAdmit();
      }
    }

    /* ==============================================
       PONTO DE ENTRADA
       Executa quando o DOM estiver pronto.
       Nao dependemos de nenhum arquivo externo aqui.
       ============================================== */
    setupAdmitForm();
    setupMobileSidebar();
    setupLogout();

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

  })();
  </script>
</body>
</html>
