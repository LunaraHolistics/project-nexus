<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ARCHIVE OS — Login</title>
    <style>
        body { background: #131313; color: #C5A059; font-family: 'JetBrains Mono', monospace; display: flex; align-items: center; justify-content: center; height: 100vh; }
        button { padding: 20px 40px; background: #003344; color: #FFBF00; border: 1px solid #C5A059; cursor: pointer; text-transform: uppercase; letter-spacing: 0.1em; }
        button:hover { background: #004d66; }
        @media (max-width: 900px) and (orientation: landscape) {
            body { height: auto; padding: 20px; }
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <button id="access-button">Acessar Sistema</button>
    <script src="api.js"></script>
    <script src="audio-system.js"></script>
    <script>
        document.getElementById('access-button').addEventListener('click', async () => {
            // Inicializar Áudio
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            window.ArchiveAudio.init(); // Assuming init handles context
            if (window.ArchiveAudio.playBoot) window.ArchiveAudio.playBoot();

            // Inicializar API e Estado
            const api = window.ArchiveAPI;
            await api.init();
            
            // Padronizar chave localStorage e dados iniciais
            let state = api.getState();
            if (!state) {
                state = {
                    player: { level: 1, credits: 1000 }
                };
                localStorage.setItem('nexus_state_v1', JSON.stringify(state));
            }
            
            // Redirecionar
            window.location.href = 'telas-individuais/06-tela-inicial.html';
        });
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
