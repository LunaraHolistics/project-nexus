    <style>
      :root {
        --surface: #131313;
        --dim: #0e0e0e;
        --on: #e5e2e1;
        --onv: #c1c7cc;
        --gold: #c5a059;
        --goldl: #e9c176;
        --bronze: #cd7f32;
        --amber: #ffbf00;
        --petrol: #003344;
        --ivory: #f5f5dc;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--surface);
        font-family: "Manrope", sans-serif;
        color: var(--on);
      }
      .grain {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9000;
        opacity: 0.035;
        background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        animation: gs 0.5s steps(4) infinite;
      }
      @keyframes gs {
        0%,
        100% {
          transform: translate(0, 0);
        }
        25% {
          transform: translate(-2%, -1%);
        }
        50% {
          transform: translate(1%, 2%);
        }
        75% {
          transform: translate(-1%, 1%);
        }
      }
      .scan {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 8999;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.025),
          rgba(0, 0, 0, 0.025) 1px,
          transparent 1px,
          transparent 3px
        );
        opacity: 0.4;
      }
      .bf {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        height: 64px;
        background: rgba(14, 14, 14, 0.92);
        backdrop-filter: blur(20px);
        border-bottom: 0.5px solid var(--gold);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 48px;
        flex-shrink: 0;
        z-index: 40;
      }
      .logo {
        font-family: "Libre Caslon Text", serif;
        font-size: 24px;
        font-weight: 700;
        color: var(--gold);
        letter-spacing: 0.15em;
      }
      .nav {
        display: flex;
        gap: 30px;
      }
      .nav a {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        color: var(--onv);
        text-decoration: none;
        letter-spacing: 0.1em;
        position: relative;
        padding-bottom: 4px;
        transition: color 0.3s;
      }
      .nav a:hover,
      .nav a.on {
        color: var(--gold);
      }
      .nav a.on::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--amber);
        box-shadow: 0 0 8px var(--amber);
      }
      .icons {
        display: flex;
        gap: 14px;
      }
      .icons svg {
        width: 20px;
        height: 20px;
        stroke: var(--gold);
        stroke-width: 1.5;
        fill: none;
        cursor: pointer;
        transition: all 0.3s;
      }
      .icons svg:hover {
        stroke: var(--amber);
      }
      .body {
        flex: 1;
        display: flex;
        padding: 40px 48px;
        gap: 40px;
        overflow: hidden;
      }
      .dos {
        flex: 1;
        position: relative;
        background: var(--ivory);
        background-image:
          url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.77 0 0 0 0 0.63 0 0 0 0 0.35 0 0 0 0.09 0'/></filter><rect width='100%25' height='100%25' filter='url(%23p)'/></svg>"),
          linear-gradient(180deg, #f5f5dc, #ece7c6);
        padding: 56px 48px;
        overflow-y: auto;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        clip-path: polygon(
          14px 0,
          calc(100% - 14px) 0,
          100% 14px,
          100% calc(100% - 14px),
          calc(100% - 14px) 100%,
          14px 100%,
          0 calc(100% - 14px),
          0 14px
        );
        animation: sl 0.8s ease-out;
      }
      .dos::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 0 0.5pt var(--gold);
        clip-path: polygon(
          14px 0,
          calc(100% - 14px) 0,
          100% 14px,
          100% calc(100% - 14px),
          calc(100% - 14px) 100%,
          14px 100%,
          0 calc(100% - 14px),
          0 14px

        from {
          opacity: 0;
          transform: translateX(-24px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

        border-color: var(--amber);

        opacity: 0.6;

      }

        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 48px;
        flex-shrink: 0;

      }
      .ft {
        font-family: "JetBrains Mono", monospace;

        color: var(--onv);

      }
      .ftc {

      }
      .sig {

      .sig .d {

      @keyframes pu {

      @media (max-width: 900px) and (orientation: landscape) {

    <script>
      (function () {
        "use strict";

        // ==============================================
        // ✅ VARIÁVEIS GLOBAIS
        // ==============================================
        let currentMission = null;

        // ==============================================
        // UTILITÁRIOS
        // ==============================================
        function showNotification(message, type) {
          type = type || "info";
          // Tenta usar ArchiveAPI.notify se disponível
          if (
            window.ArchiveAPI &&
            typeof window.ArchiveAPI.notify === "function"
          ) {
            window.ArchiveAPI.notify(message, type);
            return;
          }
          // Fallback para alert
          alert(message);
        }

        function playSound(type) {
          if (!window.ArchiveAudio) return;
          try {
            if (
              type === "success" &&
              typeof window.ArchiveAudio.playSuccess === "function"
            ) {
              window.ArchiveAudio.playSuccess();
            } else if (
              type === "error" &&
              typeof window.ArchiveAudio.playError === "function"
            ) {
              window.ArchiveAudio.playError();
            } else if (
              type === "click" &&
              typeof window.ArchiveAudio.playClick === "function"
            ) {
              window.ArchiveAudio.playClick();
            }
          } catch (e) {
            console.warn("[BRIEFING] Erro ao tocar som:", e);
          }
        }

        // ==============================================
        // ✅ INICIALIZAÇÃO CORRIGIDA
        // ==============================================
        document.addEventListener("DOMContentLoaded", async function () {
          try {
            // Verificar se ArchiveAPI está disponível
            if (!window.ArchiveAPI) {
              console.warn("[BRIEFING] ArchiveAPI não disponível");
              document.getElementById("sync-status").textContent =
                "SYS.SYNC: OFFLINE";
              showNotification(
                "ArchiveAPI não disponível. Usando dados offline.",
                "error",
              );
              return;
            }

            // Inicializa a API
            if (typeof window.ArchiveAPI.init === "function") {
              await window.ArchiveAPI.init();
            }

            document.getElementById("sync-status").textContent =
              "SYS.SYNC: ONLINE";

            // Obter ID da URL ou usar padrão 1
            const urlParams = new URLSearchParams(window.location.search);
            const missionId = parseInt(urlParams.get("id")) || 1;

            // Buscar missões
            let missions = [];
            try {
              missions = await window.ArchiveAPI.getMissions();
            } catch (err) {
              console.error("[BRIEFING] Erro ao buscar missões:", err);
              showNotification(
                "Falha ao carregar missões. Usando dados de demonstração.",
                "error",
              );
              // Fallback: dados de demonstração
              missions = [
                {
                  id: 1,
                  codename: "MERIDIAN",
                  title: "OPERAÇÃO MERIDIAN",
                  description:
                    "Um artefato antigo foi localizado em Cairo. Investigação urgente necessária para recuperar antes que caia em mãos erradas. A missão requer infiltração, análise forense e extração segura.",
                  location: "Cairo, Egito",
                  objectives: [
                    "Localizar o artefato no Museu do Cairo",
                    "Identificar a equipe adversária",
                    "Recuperar o artefato sem alertar as autoridades",
                    "Retornar à base com evidências",
                  ],
                  phase: 1,
                  totalPhases: 4,
                },
              ];
            }

            const mission =
              missions.find((m) => m.id === missionId) || missions[0];

            if (!mission) {
              showNotification("Dados da missão corrompidos.", "error");
              return;
            }

            currentMission = mission;

            // ==============================================
            // PREENCHER UI
            // ==============================================
            document.getElementById("dn").textContent =
              "DOSSIÊ #" + (mission.codename || "UNKNOWN");

            // Efeito de digitação no título
            const el = document.getElementById("dt");
            const orig = mission.title || "OPERAÇÃO SEM NOME";
            el.textContent = "";
            let i = 0;
            setTimeout(() => {
              const iv = setInterval(() => {
                if (i < orig.length) {
                  el.textContent = orig.substring(0, i + 1);
                  i++;
                } else {
                  clearInterval(iv);
                }
              }, 55);
            }, 700);

            document.getElementById("desc").textContent =
              mission.description || "Descrição não disponível.";

            // Imagem dinâmica via Pollinations (com seed fixo por missão)
            const prompt = encodeURIComponent(
              (mission.title || "ancient artifact") +
                ", ancient artifact, cinematic lighting, photorealistic, dark archive aesthetic, highly detailed, 8k",
            );
            document.getElementById("pol-img").style.backgroundImage =
              `url('https://image.pollinations.ai/prompt/${prompt}&width=400&height=300&nologo=true&seed=${mission.id}')`;

            document.getElementById("pol-cap").textContent =
              "Exhibit A — " + (mission.location || "Local desconhecido");
            document.getElementById("loc").textContent =
              mission.location || "Local desconhecido";

            // Coordenadas fictícias estilizadas
            const lat =
              Math.floor(Math.random() * 90) +
              "°" +
              Math.floor(Math.random() * 60) +
              "'N";
            const lon =
              Math.floor(Math.random() * 180) +
              "°" +
              Math.floor(Math.random() * 60) +
              "'E";
            document.getElementById("coord").textContent =
              `LAT: ${lat} // LON: ${lon}`;

            // Lista de objetivos
            const susList = document.getElementById("sus-list");
            if (mission.objectives && mission.objectives.length > 0) {
              susList.innerHTML = mission.objectives
                .map((o) => `<li>${o}</li>`)
                .join("");
            } else {
              susList.innerHTML = "<li>Objetivos não disponíveis</li>";
            }

            // ==============================================
            // ✅ AÇÃO DO BOTÃO - AGORA REDIRECIONA!
            // ==============================================
            const accBtn = document.getElementById("acc");
            accBtn.addEventListener("click", async function () {
              if (this.disabled) return;

              try {
                this.disabled = true;
                const originalHTML = this.innerHTML;
                this.innerHTML = 'Processando... <span class="ar">⏳</span>';

                // Verifica se está logado
                const state =
                  window.ArchiveAPI &&
                  typeof window.ArchiveAPI.getState === "function"
                    ? window.ArchiveAPI.getState()
                    : null;

                if (!state || !state.director) {
                  playSound("error");
                  showNotification(
                    "Faça login primeiro para aceitar missões.",
                    "error",
                  );
                  this.disabled = false;
                  this.innerHTML = originalHTML;
                  setTimeout(() => {
                    window.location.href = "/index.html";
                  }, 1500);
                  return;
                }

                // Tenta aceitar a missão via API
                let result = { success: true };
                if (
                  window.ArchiveAPI &&
                  typeof window.ArchiveAPI.acceptMission === "function"
                ) {
                  try {
                    result = await window.ArchiveAPI.acceptMission(mission.id);
                  } catch (apiErr) {
                    console.warn(
                      "[BRIEFING] API falhou, continuando offline:",
                      apiErr,
                    );
                    result = { success: true }; // Permite continuar offline
                  }
                }

                if (result && result.success) {
                  playSound("success");
                  showNotification(
                    "Missão Aceita: " + (mission.codename || "OPERAÇÃO"),
                    "success",
                  );
                  this.innerHTML =
                    'Investigação Aceita <span style="margin-left:8px">✓</span>';
                  this.style.background = "var(--amber)";
                  this.style.color = "var(--surface)";
                  this.style.borderColor = "var(--amber)";

                  // ✅ REDIRECIONA PARA A PRÓXIMA TELA APÓS 2 SEGUNDOS
                  setTimeout(() => {
                    // Pode redirecionar para Teia de Evidências ou outra tela
                    window.location.href =
                      "/telas-individuais/09-teia.html?id=" + mission.id;
                  }, 2000);
                } else {
                  playSound("error");
                  showNotification(
                    (result && result.error) || "Falha ao processar missão.",
                    "error",
                  );
                  this.disabled = false;
                  this.innerHTML = originalHTML;
                }
              } catch (err) {
                console.error("[BRIEFING] Erro ao aceitar missão:", err);
                playSound("error");
                showNotification("Erro de conexão ao aceitar missão.", "error");
                this.disabled = false;
                this.innerHTML =
                  'Aceitar Investigação <span class="ar">→</span>';
              }
            });
          } catch (err) {
            console.error("[BRIEFING] Falha ao inicializar:", err);
            showNotification("Falha ao carregar dados da missão.", "error");
            document.getElementById("sync-status").textContent =
              "SYS.SYNC: ERROR";
          }
        });

        // ==============================================
        // RELÓGIO DO RODAPÉ
        // ==============================================
        setInterval(() => {
          const n = new Date();
          const ck = document.getElementById("ck");
          if (ck) {
            ck.textContent =
              String(n.getHours()).padStart(2, "0") +
              ":" +
              String(n.getMinutes()).padStart(2, "0");
          }
        }, 1000);
      })();
    </script>

    <!-- Service Worker para PWA -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("/sw.js")
          .then(() => console.log("[PWA] Service Worker registrado"))
          .catch((err) => console.error("[PWA] Falha no registro:", err));
      }
    </script>
  </body>
</html>
