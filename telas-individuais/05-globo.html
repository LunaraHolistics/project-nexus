<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>ARCHIVE OS — Globo Interativo</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="../api.js"></script>
    <script src="../audio-system.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000;
        color: #e5e2e1;
        font-family: "JetBrains Mono", monospace;
        overflow: hidden;
      }

      #globe-container {
        position: fixed;
        inset: 0;
        z-index: 1;
        cursor: grab;
      }
      #globe-container:active {
        cursor: grabbing;
      }

      #ui-layer {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }

      .panel {
        position: absolute;
        background: rgba(10, 13, 18, 0.85);
        backdrop-filter: blur(20px);
        border: 0.5px solid rgba(197, 160, 89, 0.3);
        padding: 20px;
        pointer-events: all;
        border-radius: 4px;
      }

      #mission-panel {
        top: 80px;
        left: 20px;
        width: 320px;
        max-height: calc(100vh - 120px);
        overflow-y: auto;
      }

      #info-panel {
        top: 80px;
        right: 20px;
        width: 300px;
      }

      .mission-card {
        background: rgba(197, 160, 89, 0.05);
        border: 1px solid rgba(197, 160, 89, 0.2);
        padding: 16px;
        margin-bottom: 12px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s;
      }

      .mission-card:hover {
        background: rgba(197, 160, 89, 0.1);
        border-color: rgba(197, 160, 89, 0.5);
        transform: translateX(4px);
      }

      .mission-card.active {
        border-color: #ffbf00;
        box-shadow: 0 0 20px rgba(255, 191, 0, 0.3);
      }

      .mission-title {
        font-family: "Libre Caslon Text", serif;
        font-size: 16px;
        color: #c5a059;
        margin-bottom: 8px;
      }

      .mission-location {
        font-size: 12px;
        color: #c1c7cc;
        margin-bottom: 4px;
      }

      .mission-priority {
        display: inline-block;
        padding: 2px 8px;
        font-size: 10px;
        border-radius: 3px;
        margin-top: 8px;
      }

      .priority-alta {
        background: rgba(239, 68, 68, 0.2);
        color: #ef4444;
      }
      .priority-media {
        background: rgba(245, 158, 11, 0.2);
        color: #f59e0b;
      }
      .priority-baixa {
        background: rgba(74, 222, 128, 0.2);
        color: #4ade80;
      }
      .priority-critica {
        background: rgba(239, 68, 68, 0.3);
        color: #ef4444;
        font-weight: bold;
      }

      .info-section {
        margin-bottom: 16px;
      }

      .info-label {
        font-size: 10px;
        color: #c1c7cc;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 6px;
      }

      .info-value {
        font-size: 14px;
        color: #e5e2e1;
      }

      #loading {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        flex-direction: column;
        gap: 20px;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 2px solid rgba(197, 160, 89, 0.2);
        border-top-color: #c5a059;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <div>SINCRONIZANDO...</div>
    </div>

    <div id="globe-container"></div>

    <div id="ui-layer">
      <div id="mission-panel" class="panel">
        <div
          style="
            font-size: 12px;
            color: #c5a059;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
          "
        >
          ALVOS ATIVOS <span id="mission-count" style="float: right">0</span>
        </div>
        <div id="missions-list"></div>
      </div>

      <div id="info-panel" class="panel">
        <div class="info-section">
          <div class="info-label">Interseção Global</div>
          <div class="info-value" id="system-status">Aguardando Seleção</div>
        </div>
        <div class="info-section">
          <div class="info-label">Missões Disponíveis</div>
          <div class="info-value" id="total-missions">0</div>
        </div>
        <div class="info-section">
          <div class="info-label">Nível de Ameaça</div>
          <div class="info-value" id="threat-level">—</div>
        </div>
        <div id="mission-details" class="hidden">
          <div class="info-section">
            <div class="info-label">Localização</div>
            <div class="info-value" id="detail-location">—</div>
          </div>
          <div class="info-section">
            <div class="info-label">Fase Atual</div>
            <div class="info-value" id="detail-phase">—</div>
          </div>
          <div class="info-section">
            <div class="info-label">Descrição</div>
            <div
              class="info-value"
              id="detail-desc"
              style="font-size: 12px; line-height: 1.6"
            >
              —
            </div>
          </div>
          <div class="info-section">
            <div class="info-label">Objetivos</div>
            <div
              class="info-value"
              id="detail-objectives"
              style="font-size: 12px"
            >
              —
            </div>
          </div>
          <div class="info-section">
            <div class="info-label">Recompensa</div>
            <div class="info-value" id="detail-reward" style="color: #c5a059">
              —
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        let scene,
          camera,
          renderer,
          controls,
          globe,
          markers = [];
        let missions = [];
        let selectedMission = null;
        let isDragging = false;
        let autoRotate = true;
        let autoRotateSpeed = 0.3;

        // Coordenadas das cidades
        const cityCoords = {
          "Viena, Áustria": { lat: 48.2082, lon: 16.3738 },
          "Londres, Reino Unido": { lat: 51.5074, lon: -0.1278 },
          "Cusco, Peru": { lat: -13.5319, lon: -71.9675 },
          "Roma, Itália": { lat: 41.9028, lon: 12.4964 },
          "Mumbai, Índia": { lat: 19.076, lon: 72.8777 },
          "Tóquio, Japão": { lat: 35.6762, lon: 139.6503 },
          "Cairo, Egito": { lat: 30.0444, lon: 31.2357 },
          "Pequim, China": { lat: 39.9042, lon: 116.4074 },
          "Berlim, Alemanha": { lat: 52.52, lon: 13.405 },
          "Paris, França": { lat: 48.8566, lon: 2.3522 },
          "Atenas, Grécia": { lat: 37.9838, lon: 23.7275 },
          "Nova York, EUA": { lat: 40.7128, lon: -74.006 },
          "Cidade do México, México": { lat: 19.4326, lon: -99.1332 },
          "Dubai, EAU": { lat: 25.2048, lon: 55.2708 },
          "Luxor, Egito": { lat: 25.6872, lon: 32.6396 },
          "Bangkok, Tailândia": { lat: 13.7563, lon: 100.5018 },
          "Moscou, Rússia": { lat: 55.7558, lon: 37.6173 },
          "Rio de Janeiro, Brasil": { lat: -22.9068, lon: -43.1729 },
          "Istambul, Turquia": { lat: 41.0082, lon: 28.9784 },
        };

        function init() {
          // Cena
          scene = new THREE.Scene();

          // Câmera
          camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000,
          );
          camera.position.z = 3;
          camera.position.y = 0.5;

          // Renderer
          renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.setPixelRatio(window.devicePixelRatio);
          document
            .getElementById("globe-container")
            .appendChild(renderer.domElement);

          // Controls
          controls = new THREE.OrbitControls(camera, renderer.domElement);
          controls.enableDamping = true;
          controls.dampingFactor = 0.05;
          controls.enableZoom = true;
          controls.minDistance = 1.5;
          controls.maxDistance = 5;
          controls.autoRotate = true;
          controls.autoRotateSpeed = autoRotateSpeed;

          // Luzes
          const ambientLight = new THREE.AmbientLight(0x404040, 1);
          scene.add(ambientLight);

          const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
          directionalLight.position.set(5, 3, 5);
          scene.add(directionalLight);

          const pointLight = new THREE.PointLight(0xc5a059, 0.5);
          pointLight.position.set(-5, 2, -5);
          scene.add(pointLight);

          // Criar globo
          createGlobe();

          // Carregar missões
          loadMissions();

          // Event listeners
          window.addEventListener("resize", onWindowResize);

          // Esconder loading
          setTimeout(() => {
            document.getElementById("loading").classList.add("hidden");
          }, 1000);

          // Loop de animação
          animate();
        }

        function createGlobe() {
          // Geometria do globo
          const geometry = new THREE.SphereGeometry(1, 64, 64);

          // Material com textura wireframe
          const material = new THREE.MeshPhongMaterial({
            color: 0x0a3a5c,
            emissive: 0x001133,
            specular: 0x111111,
            shininess: 10,
            wireframe: false,
            transparent: true,
            opacity: 0.95,
          });

          globe = new THREE.Mesh(geometry, material);
          scene.add(globe);

          // Wireframe overlay
          const wireGeometry = new THREE.SphereGeometry(1.01, 32, 32);
          const wireMaterial = new THREE.MeshBasicMaterial({
            color: 0xc5a059,
            wireframe: true,
            transparent: true,
            opacity: 0.15,
          });

          const wireframe = new THREE.Mesh(wireGeometry, wireMaterial);
          globe.add(wireframe);

          // Atmosfera
          const atmosphereGeometry = new THREE.SphereGeometry(1.2, 32, 32);
          const atmosphereMaterial = new THREE.MeshPhongMaterial({
            color: 0x4ade80,
            transparent: true,
            opacity: 0.1,
            side: THREE.BackSide,
          });

          const atmosphere = new THREE.Mesh(
            atmosphereGeometry,
            atmosphereMaterial,
          );
          scene.add(atmosphere);
        }

        function createMarker(lat, lon, mission) {
          // Converter lat/lon para coordenadas 3D
          const phi = (90 - lat) * (Math.PI / 180);
          const theta = (lon + 180) * (Math.PI / 180);

          const radius = 1.05;
          const x = -(radius * Math.sin(phi) * Math.cos(theta));
          const z = radius * Math.sin(phi) * Math.sin(theta);
          const y = radius * Math.cos(phi);

          // Grupo do marcador
          const markerGroup = new THREE.Group();
          markerGroup.position.set(x, y, z);
          markerGroup.lookAt(0, 0, 0);

          // Círculo base
          const circleGeometry = new THREE.RingGeometry(0.02, 0.04, 32);
          const circleMaterial = new THREE.MeshBasicMaterial({
            color: getPriorityColor(mission.priority),
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.8,
          });

          const circle = new THREE.Mesh(circleGeometry, circleMaterial);
          markerGroup.add(circle);

          // Ponto central
          const pointGeometry = new THREE.SphereGeometry(0.015, 16, 16);
          const pointMaterial = new THREE.MeshBasicMaterial({
            color: 0xffbf00,
          });

          const point = new THREE.Mesh(pointGeometry, pointMaterial);
          markerGroup.add(point);

          // Anel pulsante
          const ringGeometry = new THREE.RingGeometry(0.04, 0.06, 32);
          const ringMaterial = new THREE.MeshBasicMaterial({
            color: getPriorityColor(mission.priority),
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.3,
          });

          const ring = new THREE.Mesh(ringGeometry, ringMaterial);
          ring.userData = { isPulsing: true };
          markerGroup.add(ring);

          // Adicionar ao globo
          globe.add(markerGroup);
          markers.push({ mesh: markerGroup, mission: mission });

          return markerGroup;
        }

        function getPriorityColor(priority) {
          switch (priority) {
            case "CRÍTICA":
              return 0xef4444;
            case "ALTA":
              return 0xf59e0b;
            case "MÉDIA":
              return 0x3b82f6;
            case "BAIXA":
              return 0x4ade80;
            default:
              return 0xc5a059;
          }
        }

        async function loadMissions() {
          try {
            await window.ArchiveAPI.init();
            missions = await window.ArchiveAPI.getMissions();

            document.getElementById("mission-count").textContent =
              missions.length;
            document.getElementById("total-missions").textContent =
              missions.length;

            // Criar marcadores
            missions.forEach((mission) => {
              const coords = cityCoords[mission.location];
              if (coords) {
                createMarker(coords.lat, coords.lon, mission);
              }
            });

            // Renderizar lista de missões
            renderMissionList();
          } catch (error) {
            console.error("Erro ao carregar missões:", error);
          }
        }

        function renderMissionList() {
          const list = document.getElementById("missions-list");
          list.innerHTML = "";

          missions.forEach((mission) => {
            const card = document.createElement("div");
            card.className = "mission-card";
            card.innerHTML = `
            <div class="mission-title">${mission.title}</div>
            <div class="mission-location">${mission.location}</div>
            <div class="mission-priority priority-${mission.priority.toLowerCase()}">${mission.priority}</div>
          `;

            card.addEventListener("click", () => selectMission(mission));
            list.appendChild(card);
          });
        }

        function selectMission(mission) {
          selectedMission = mission;

          // Atualizar UI
          document.querySelectorAll(".mission-card").forEach((card) => {
            card.classList.remove("active");
            if (
              card.querySelector(".mission-title").textContent === mission.title
            ) {
              card.classList.add("active");
            }
          });

          document.getElementById("system-status").textContent =
            "Missão Selecionada";
          document.getElementById("mission-details").classList.remove("hidden");
          document.getElementById("detail-location").textContent =
            mission.location;
          document.getElementById("detail-phase").textContent =
            `Fase ${mission.phase} de ${mission.totalPhases}`;
          document.getElementById("detail-desc").textContent =
            mission.description;
          document.getElementById("detail-objectives").innerHTML =
            mission.objectives.map((obj) => `• ${obj}`).join("<br>");
          document.getElementById("detail-reward").textContent =
            `${mission.reward.xp} XP • ${mission.reward.credits} CR`;
          document.getElementById("threat-level").textContent =
            mission.priority;
          document.getElementById("threat-level").className =
            `info-value priority-${mission.priority.toLowerCase()}`;

          // Som
          if (window.ArchiveAudio) {
            window.ArchiveAudio.playClick();
          }

          // Parar rotação automática
          autoRotate = false;
          controls.autoRotate = false;

          // Focar no marcador
          focusOnMarker(mission);
        }

        function focusOnMarker(mission) {
          const coords = cityCoords[mission.location];
          if (!coords) return;

          const phi = (90 - coords.lat) * (Math.PI / 180);
          const theta = (coords.lon + 180) * (Math.PI / 180);

          const radius = 2.5;
          const x = -(radius * Math.sin(phi) * Math.cos(theta));
          const z = radius * Math.sin(phi) * Math.sin(theta);
          const y = radius * Math.cos(phi);

          // Animar câmera
          const startPos = camera.position.clone();
          const endPos = new THREE.Vector3(x, y, z);

          let progress = 0;
          const duration = 1000;
          const startTime = Date.now();

          function animateCamera() {
            progress = (Date.now() - startTime) / duration;

            if (progress < 1) {
              camera.position.lerpVectors(startPos, endPos, progress);
              camera.lookAt(0, 0, 0);
              requestAnimationFrame(animateCamera);
            } else {
              camera.position.copy(endPos);
              camera.lookAt(0, 0, 0);
            }
          }

          animateCamera();
        }

        function onWindowResize() {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
          requestAnimationFrame(animate);

          // Atualizar controls
          controls.update();

          // Pulsar anéis dos marcadores
          markers.forEach((marker) => {
            const ring = marker.mesh.children[2];
            if (ring && ring.userData.isPulsing) {
              const scale = 1 + Math.sin(Date.now() * 0.003) * 0.3;
              ring.scale.set(scale, scale, scale);
              ring.material.opacity = 0.3 - (scale - 1) * 0.2;
            }
          });

          renderer.render(scene, camera);
        }

        // Inicializar
        init();
      })();
    </script>
  </body>
</html>
