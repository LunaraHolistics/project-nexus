<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>ARCHIVE OS — Globo Interativo</title>

    <!-- ========================================
         FONTES CORRETAS (Google Fonts)
         ======================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Manrope:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- ========================================
         FONT AWESOME COM ATRIBUTOS DE SEGURANÇA
         ======================================== -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- ========================================
         THREE.JS (Biblioteca 3D)
         ======================================== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- ========================================
         SCRIPTS DO SISTEMA (caminhos absolutos)
         ======================================== -->
    <script src="/api.js"></script>
    <script src="/audio-system.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000;
        color: #e5e2e1;
        font-family: "JetBrains Mono", monospace;
        overflow: hidden;
      }

      #globe-container {
        position: fixed;
        inset: 0;
        z-index: 1;
        cursor: grab;
      }
      #globe-container:active {
        cursor: grabbing;
      }

      #ui-layer {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }

      .panel {
        position: absolute;
        background: rgba(10, 13, 18, 0.85);
        backdrop-filter: blur(20px);
        border: 0.5px solid rgba(197, 160, 89, 0.3);
        padding: 20px;
        pointer-events: all;
        border-radius: 4px;
      }

      #mission-panel {
        top: 80px;
        left: 20px;
        width: 320px;
        max-height: calc(100vh - 120px);
        overflow-y: auto;
      }

      #info-panel {
        top: 80px;
        right: 20px;
        width: 300px;
      }

      .mission-card {
        background: rgba(197, 160, 89, 0.05);
        border: 1px solid rgba(197, 160, 89, 0.2);
        padding: 16px;
        margin-bottom: 12px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s;
      }

      .mission-card:hover {
        background: rgba(197, 160, 89, 0.1);
        border-color: rgba(197, 160, 89, 0.5);
        transform: translateX(4px);
      }

      .mission-card.active {
        border-color: #ffbf00;
        box-shadow: 0 0 20px rgba(255, 191, 0, 0.3);
      }

      .mission-title {
        font-family: "Libre Caslon Text", serif;
        font-size: 16px;
        color: #c5a059;
        margin-bottom: 8px;
      }

      .mission-location {
        font-size: 12px;
        color: #c1c7cc;
        margin-bottom: 4px;
      }

      .mission-priority {
        display: inline-block;
        padding: 2px 8px;
        font-size: 10px;
        border-radius: 3px;
        margin-top: 8px;
      }

      .priority-alta {
        background: rgba(239, 68, 68, 0.2);
        color: #ef4444;
      }
      .priority-media {
        background: rgba(245, 158, 11, 0.2);
        color: #f59e0b;
      }
      .priority-baixa {
        background: rgba(74, 222, 128, 0.2);
        color: #4ade80;
      }
      .priority-critica {
        background: rgba(239, 68, 68, 0.3);
        color: #ef4444;
        font-weight: bold;
      }

      .info-section {
        margin-bottom: 16px;
      }

      .info-label {
        font-size: 10px;
        color: #c1c7cc;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 6px;
      }

      .info-value {
        font-size: 14px;
        color: #e5e2e1;
      }

      .mission-btn {
        width: 100%;
        margin-top: 16px;
        padding: 12px;
        background: #c5a059;
        color: #000;
        border: none;
        border-radius: 4px;
        font-family: "JetBrains Mono", monospace;
        font-weight: bold;
        font-size: 12px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        transition: all 0.3s;
      }

      .mission-btn:hover:not(:disabled) {
        background: #ffbf00;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(255, 191, 0, 0.4);
      }

      .mission-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      #loading {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        flex-direction: column;
        gap: 20px;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 2px solid rgba(197, 160, 89, 0.2);
        border-top-color: #c5a059;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .hidden {
        display: none !important;
      }

      /* Painéis com scroll customizado */
      #mission-panel::-webkit-scrollbar,
      #info-panel::-webkit-scrollbar {
        width: 4px;
      }
      #mission-panel::-webkit-scrollbar-thumb,
      #info-panel::-webkit-scrollbar-thumb {
        background: rgba(197, 160, 89, 0.3);
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <div>SINCRONIZANDO...</div>
    </div>

    <div id="globe-container"></div>

    <div id="ui-layer">
      <div id="mission-panel" class="panel">
        <div
          style="
            font-size: 12px;
            color: #c5a059;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
          "
        >
          ALVOS ATIVOS <span id="mission-count" style="float: right">0</span>
        </div>
        <div id="missions-list"></div>
      </div>

      <div id="info-panel" class="panel">
        <div class="info-section">
          <div class="info-label">Interseção Global</div>
          <div class="info-value" id="system-status">Aguardando Seleção</div>
        </div>
        <div class="info-section">
          <div class="info-label">Missões Disponíveis</div>
          <div class="info-value" id="total-missions">0</div>
        </div>
        <div class="info-section">
          <div class="info-label">Nível de Ameaça</div>
          <div class="info-value" id="threat-level">—</div>
        </div>
        <div id="mission-details" class="hidden">
          <div class="info-section">
            <div class="info-label">Localização</div>
            <div class="info-value" id="detail-location">—</div>
          </div>
          <div class="info-section">
            <div class="info-label">Fase Atual</div>
            <div class="info-value" id="detail-phase">—</div>
          </div>
          <div class="info-section">
            <div class="info-label">Descrição</div>
            <div
              class="info-value"
              id="detail-desc"
              style="font-size: 12px; line-height: 1.6"
            >
              —
            </div>
          </div>
          <div class="info-section">
            <div class="info-label">Objetivos</div>
            <div
              class="info-value"
              id="detail-objectives"
              style="font-size: 12px"
            >
              —
            </div>
          </div>
          <div class="info-section">
            <div class="info-label">Recompensa</div>
            <div class="info-value" id="detail-reward" style="color: #c5a059">
              —
            </div>
          </div>
          <button id="accept-mission-btn" class="mission-btn">
            ACEITAR MISSÃO
          </button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        let scene, camera, renderer, controls, globe, globeGroup;
        let markers = [];
        let missions = [];
        let selectedMission = null;

        // 🆕 Raycaster para detectar cliques no globo
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let mouseDownPos = { x: 0, y: 0 };
        let isDragging = false;
        let hoveredMarker = null;

        const cityCoords = {
          "Viena, Áustria": { lat: 48.2082, lon: 16.3738 },
          "Londres, Reino Unido": { lat: 51.5074, lon: -0.1278 },
          "Cusco, Peru": { lat: -13.5319, lon: -71.9675 },
          "Roma, Itália": { lat: 41.9028, lon: 12.4964 },
          "Mumbai, Índia": { lat: 19.076, lon: 72.8777 },
          "Tóquio, Japão": { lat: 35.6762, lon: 139.6503 },
          "Cairo, Egito": { lat: 30.0444, lon: 31.2357 },
          "Pequim, China": { lat: 39.9042, lon: 116.4074 },
          "Berlim, Alemanha": { lat: 52.52, lon: 13.405 },
          "Paris, França": { lat: 48.8566, lon: 2.3522 },
          "Atenas, Grécia": { lat: 37.9838, lon: 23.7275 },
          "Nova York, EUA": { lat: 40.7128, lon: -74.006 },
          "Cidade do México, México": { lat: 19.4326, lon: -99.1332 },
          "Dubai, EAU": { lat: 25.2048, lon: 55.2708 },
          "Luxor, Egito": { lat: 25.6872, lon: 32.6396 },
          "Bangkok, Tailândia": { lat: 13.7563, lon: 100.5018 },
          "Moscou, Rússia": { lat: 55.7558, lon: 37.6173 },
          "Rio de Janeiro, Brasil": { lat: -22.9068, lon: -43.1729 },
          "Istambul, Turquia": { lat: 41.0082, lon: 28.9784 },
        };

        function init() {
          scene = new THREE.Scene();
          camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000,
          );
          camera.position.z = 3;
          camera.position.y = 0.5;

          renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.setPixelRatio(window.devicePixelRatio);
          document
            .getElementById("globe-container")
            .appendChild(renderer.domElement);

          controls = new THREE.OrbitControls(camera, renderer.domElement);
          controls.enableDamping = true;
          controls.dampingFactor = 0.05;
          controls.enableZoom = true;
          controls.minDistance = 1.5;
          controls.maxDistance = 5;
          controls.autoRotate = true;
          controls.autoRotateSpeed = 0.5;

          // Iluminação
          const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
          scene.add(ambientLight);
          const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
          directionalLight.position.set(5, 3, 5);
          scene.add(directionalLight);
          const directionalLight2 = new THREE.DirectionalLight(0x6699ff, 0.3);
          directionalLight2.position.set(-5, -2, -5);
          scene.add(directionalLight2);
          const pointLight = new THREE.PointLight(0xc5a059, 0.6);
          pointLight.position.set(-5, 2, -5);
          scene.add(pointLight);

          globeGroup = new THREE.Group();
          scene.add(globeGroup);

          createGlobe();
          loadMissions();

          window.addEventListener("resize", onWindowResize);

          // 🆕 EVENTOS DE CLIQUE E HOVER NO GLOBO
          renderer.domElement.addEventListener("mousedown", onMouseDown);
          renderer.domElement.addEventListener("mousemove", onMouseMove);
          renderer.domElement.addEventListener("mouseup", onMouseUp);
          renderer.domElement.addEventListener("touchstart", onTouchStart, {
            passive: true,
          });
          renderer.domElement.addEventListener("touchend", onTouchEnd);

          setTimeout(() => {
            document.getElementById("loading").classList.add("hidden");
          }, 1500);

          animate();
        }

        // ==============================================
        // 🆕 HANDLERS DE CLIQUE NO GLOBO (diferencia click de drag)
        // ==============================================
        function onMouseDown(event) {
          mouseDownPos = { x: event.clientX, y: event.clientY };
          isDragging = false;
        }

        function onMouseMove(event) {
          // Detecta se é drag (mouse moveu mais que 5px)
          if (mouseDownPos.x !== null) {
            const dx = event.clientX - mouseDownPos.x;
            const dy = event.clientY - mouseDownPos.y;
            if (Math.sqrt(dx * dx + dy * dy) > 5) {
              isDragging = true;
            }
          }

          // 🆕 HOVER: muda cursor quando passa sobre um marker
          updateMousePosition(event.clientX, event.clientY);
          raycaster.setFromCamera(mouse, camera);

          const markerMeshes = markers.map((m) => m.mesh);
          const intersects = raycaster.intersectObjects(markerMeshes, true);

          if (intersects.length > 0) {
            renderer.domElement.style.cursor = "pointer";
            const hitObject = intersects[0].object;
            const markerData = findMarkerByMesh(hitObject);
            if (markerData && hoveredMarker !== markerData) {
              if (hoveredMarker) unhoverMarker(hoveredMarker);
              hoverMarker(markerData);
              hoveredMarker = markerData;
            }
          } else {
            renderer.domElement.style.cursor = controls.enabled
              ? "grab"
              : "default";
            if (hoveredMarker) {
              unhoverMarker(hoveredMarker);
              hoveredMarker = null;
            }
          }
        }

        function onMouseUp(event) {
          // Só trata como clique se NÃO foi drag
          if (!isDragging) {
            updateMousePosition(event.clientX, event.clientY);
            handleGlobeClick();
          }
          mouseDownPos = { x: null, y: null };
        }

        function onTouchStart(event) {
          if (event.touches.length === 1) {
            const touch = event.touches[0];
            mouseDownPos = { x: touch.clientX, y: touch.clientY };
            isDragging = false;
          }
        }

        function onTouchEnd(event) {
          if (!isDragging && event.changedTouches.length === 1) {
            const touch = event.changedTouches[0];
            updateMousePosition(touch.clientX, touch.clientY);
            handleGlobeClick();
          }
        }

        function updateMousePosition(clientX, clientY) {
          const rect = renderer.domElement.getBoundingClientRect();
          mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
        }

        function handleGlobeClick() {
          raycaster.setFromCamera(mouse, camera);
          const markerMeshes = markers.map((m) => m.mesh);
          const intersects = raycaster.intersectObjects(markerMeshes, true);

          if (intersects.length > 0) {
            const hitObject = intersects[0].object;
            const markerData = findMarkerByMesh(hitObject);
            if (markerData) {
              console.log(
                "[GLOBE] Marker clicado:",
                markerData.mission.codename,
              );
              selectMission(markerData.mission);

              if (
                window.ArchiveAudio &&
                typeof window.ArchiveAudio.playClick === "function"
              ) {
                window.ArchiveAudio.playClick();
              }
            }
          }
        }

        function findMarkerByMesh(mesh) {
          // Sobe na hierarquia até encontrar o markerGroup
          let current = mesh;
          while (current) {
            const found = markers.find((m) => m.mesh === current);
            if (found) return found;
            current = current.parent;
          }
          return null;
        }

        function hoverMarker(markerData) {
          // Destaca o marker no hover
          markerData.mesh.children.forEach((child) => {
            if (child.material && child.material.opacity !== undefined) {
              child.userData.originalOpacity = child.material.opacity;
              child.material.opacity = Math.min(
                1,
                child.material.opacity * 1.5,
              );
            }
          });
          markerData.mesh.scale.set(1.3, 1.3, 1.3);
        }

        function unhoverMarker(markerData) {
          markerData.mesh.children.forEach((child) => {
            if (child.userData.originalOpacity !== undefined) {
              child.material.opacity = child.userData.originalOpacity;
            }
          });
          markerData.mesh.scale.set(1, 1, 1);
        }

        // ==============================================
        // GLOBO (código original mantido)
        // ==============================================
        function createGlobe() {
          const loader = new THREE.TextureLoader();
          loader.crossOrigin = "anonymous";

          const earthTextureUrl =
            "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg";
          const earthBumpUrl =
            "https://unpkg.com/three-globe/example/img/earth-topology.png";

          const geometry = new THREE.SphereGeometry(1, 64, 64);
          const baseMaterial = new THREE.MeshPhongMaterial({
            color: 0x1a4a7c,
            emissive: 0x001a33,
            specular: 0x222244,
            shininess: 15,
          });

          globe = new THREE.Mesh(geometry, baseMaterial);
          globeGroup.add(globe);

          loader.load(
            earthTextureUrl,
            (texture) => {
              globe.material.map = texture;
              globe.material.needsUpdate = true;
            },
            undefined,
            (err) => {
              console.warn("[GLOBE] Falha ao carregar textura:", err);
            },
          );

          loader.load(earthBumpUrl, (bumpMap) => {
            globe.material.bumpMap = bumpMap;
            globe.material.bumpScale = 0.05;
            globe.material.needsUpdate = true;
          });

          // Wireframe dourado
          const wireGeometry = new THREE.SphereGeometry(1.01, 32, 32);
          const wireMaterial = new THREE.MeshBasicMaterial({
            color: 0xc5a059,
            wireframe: true,
            transparent: true,
            opacity: 0.12,
          });
          globeGroup.add(new THREE.Mesh(wireGeometry, wireMaterial));

          // Grid lat/lon
          const gridMaterial = new THREE.LineBasicMaterial({
            color: 0xc5a059,
            transparent: true,
            opacity: 0.15,
          });
          for (let lat = -60; lat <= 60; lat += 30) {
            const phi = (90 - lat) * (Math.PI / 180);
            const points = [];
            for (let lon = 0; lon <= 360; lon += 5) {
              const theta = (lon + 180) * (Math.PI / 180);
              const r = 1.015;
              const x = -(r * Math.sin(phi) * Math.cos(theta));
              const y = r * Math.cos(phi);
              const z = r * Math.sin(phi) * Math.sin(theta);
              points.push(new THREE.Vector3(x, y, z));
            }
            globeGroup.add(
              new THREE.Line(
                new THREE.BufferGeometry().setFromPoints(points),
                gridMaterial,
              ),
            );
          }
          for (let lon = 0; lon < 360; lon += 30) {
            const theta = (lon + 180) * (Math.PI / 180);
            const points = [];
            for (let lat = -90; lat <= 90; lat += 5) {
              const phi = (90 - lat) * (Math.PI / 180);
              const r = 1.015;
              const x = -(r * Math.sin(phi) * Math.cos(theta));
              const y = r * Math.cos(phi);
              const z = r * Math.sin(phi) * Math.sin(theta);
              points.push(new THREE.Vector3(x, y, z));
            }
            globeGroup.add(
              new THREE.Line(
                new THREE.BufferGeometry().setFromPoints(points),
                gridMaterial,
              ),
            );
          }

          // Atmosfera
          const atmosphereGeometry = new THREE.SphereGeometry(1.15, 32, 32);
          const atmosphereMaterial = new THREE.MeshPhongMaterial({
            color: 0x4ade80,
            transparent: true,
            opacity: 0.08,
            side: THREE.BackSide,
          });
          globeGroup.add(
            new THREE.Mesh(atmosphereGeometry, atmosphereMaterial),
          );

          // Glow
          const glowGeometry = new THREE.SphereGeometry(1.25, 32, 32);
          const glowMaterial = new THREE.ShaderMaterial({
            uniforms: {
              c: { type: "f", value: 0.4 },
              p: { type: "f", value: 3.5 },
              glowColor: { type: "c", value: new THREE.Color(0xc5a059) },
              viewVector: { type: "v3", value: camera.position },
            },
            vertexShader: `
          uniform vec3 viewVector;
          uniform float c;
          uniform float p;
          varying float intensity;
          void main() {
            vec3 vNormal = normalize(normalMatrix * normal);
            vec3 vNormel = normalize(normalMatrix * viewVector);
            intensity = pow(c - dot(vNormal, vNormel), p);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
            fragmentShader: `
          uniform vec3 glowColor;
          varying float intensity;
          void main() {
            vec3 glow = glowColor * intensity;
            gl_FragColor = vec4(glow, intensity * 0.4);
          }
        `,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending,
            transparent: true,
          });
          const glow = new THREE.Mesh(glowGeometry, glowMaterial);
          glow.userData = { isGlow: true, material: glowMaterial };
          globeGroup.add(glow);
        }

        function createMarker(lat, lon, mission) {
          const phi = (90 - lat) * (Math.PI / 180);
          const theta = (lon + 180) * (Math.PI / 180);
          const radius = 1.05;

          const x = -(radius * Math.sin(phi) * Math.cos(theta));
          const z = radius * Math.sin(phi) * Math.sin(theta);
          const y = radius * Math.cos(phi);

          const markerGroup = new THREE.Group();
          markerGroup.position.set(x, y, z);
          markerGroup.lookAt(0, 0, 0);
          // 🆕 Guarda referência da missão no próprio grupo (para raycasting recuperar)
          markerGroup.userData.missionId = mission.id;

          const circleGeometry = new THREE.RingGeometry(0.02, 0.04, 32);
          const circleMaterial = new THREE.MeshBasicMaterial({
            color: getPriorityColor(mission.priority),
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.8,
          });
          markerGroup.add(new THREE.Mesh(circleGeometry, circleMaterial));

          const pointGeometry = new THREE.SphereGeometry(0.015, 16, 16);
          const pointMaterial = new THREE.MeshBasicMaterial({
            color: 0xffbf00,
          });
          markerGroup.add(new THREE.Mesh(pointGeometry, pointMaterial));

          const ringGeometry = new THREE.RingGeometry(0.04, 0.06, 32);
          const ringMaterial = new THREE.MeshBasicMaterial({
            color: getPriorityColor(mission.priority),
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.3,
          });
          const ring = new THREE.Mesh(ringGeometry, ringMaterial);
          ring.userData = { isPulsing: true };
          markerGroup.add(ring);

          globeGroup.add(markerGroup);
          markers.push({ mesh: markerGroup, mission: mission });
        }

        function getPriorityColor(priority) {
          switch (priority) {
            case "CRÍTICA":
              return 0xef4444;
            case "ALTA":
              return 0xf59e0b;
            case "MÉDIA":
              return 0x3b82f6;
            case "BAIXA":
              return 0x4ade80;
            default:
              return 0xc5a059;
          }
        }

        async function loadMissions() {
          try {
            if (!window.ArchiveAPI) {
              console.warn("[GLOBE] ArchiveAPI não disponível");
              renderMissionList();
              return;
            }
            await window.ArchiveAPI.init();
            missions = await window.ArchiveAPI.getMissions();

            document.getElementById("mission-count").textContent =
              missions.length;
            document.getElementById("total-missions").textContent =
              missions.length;

            missions.forEach((mission) => {
              const coords = cityCoords[mission.location];
              if (coords) createMarker(coords.lat, coords.lon, mission);
            });

            renderMissionList();
          } catch (error) {
            console.error("[GLOBE] Erro ao carregar missões:", error);
            renderMissionList();
          }
        }

        function renderMissionList() {
          const list = document.getElementById("missions-list");
          list.innerHTML = "";
          missions.forEach((mission) => {
            const card = document.createElement("div");
            card.className = "mission-card";
            const priorityClass = mission.priority
              .toLowerCase()
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "");
            card.innerHTML = `
          <div class="mission-title">${mission.title}</div>
          <div class="mission-location">${mission.location}</div>
          <div class="mission-priority priority-${priorityClass}">${mission.priority}</div>
        `;
            card.addEventListener("click", () => selectMission(mission));
            list.appendChild(card);
          });
        }

        function selectMission(mission) {
          selectedMission = mission;
          document.querySelectorAll(".mission-card").forEach((card) => {
            card.classList.remove("active");
            if (
              card.querySelector(".mission-title").textContent === mission.title
            ) {
              card.classList.add("active");
            }
          });

          document.getElementById("system-status").textContent =
            "Missão Selecionada";
          document.getElementById("mission-details").classList.remove("hidden");
          document.getElementById("detail-location").textContent =
            mission.location;
          document.getElementById("detail-phase").textContent =
            `Fase ${mission.phase} de ${mission.totalPhases}`;
          document.getElementById("detail-desc").textContent =
            mission.description;
          document.getElementById("detail-objectives").innerHTML =
            mission.objectives.map((obj) => `• ${obj}`).join("<br>");

          const reward = mission.reward || { xp: 0, credits: 0, artifacts: 0 };
          document.getElementById("detail-reward").textContent =
            `${reward.xp} XP • ${reward.credits} CR`;

          const priorityClass = mission.priority
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");
          document.getElementById("threat-level").textContent =
            mission.priority;
          document.getElementById("threat-level").className =
            `info-value priority-${priorityClass}`;

          controls.autoRotate = false;
          focusOnMarker(mission);
        }

        function focusOnMarker(mission) {
          const coords = cityCoords[mission.location];
          if (!coords) return;

          const phi = (90 - coords.lat) * (Math.PI / 180);
          const theta = (coords.lon + 180) * (Math.PI / 180);
          const targetRadius = 1.05;
          const targetX = -(targetRadius * Math.sin(phi) * Math.cos(theta));
          const targetY = targetRadius * Math.cos(phi);
          const targetZ = targetRadius * Math.sin(phi) * Math.sin(theta);
          const camRadius = 2.5;
          const camX = -(camRadius * Math.sin(phi) * Math.cos(theta));
          const camY = camRadius * Math.cos(phi);
          const camZ = camRadius * Math.sin(phi) * Math.sin(theta);

          const startPos = camera.position.clone();
          const startTarget = controls.target.clone();
          const endPos = new THREE.Vector3(camX, camY, camZ);
          const endTarget = new THREE.Vector3(targetX, targetY, targetZ);
          const duration = 1000;
          const startTime = Date.now();

          function animateCamera() {
            const progress = Math.min((Date.now() - startTime) / duration, 1);
            const ease = 1 - Math.pow(1 - progress, 3);
            camera.position.lerpVectors(startPos, endPos, ease);
            controls.target.lerpVectors(startTarget, endTarget, ease);
            controls.update();
            if (progress < 1) requestAnimationFrame(animateCamera);
          }
          animateCamera();
        }

        function onWindowResize() {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
          requestAnimationFrame(animate);
          controls.update();

          markers.forEach((marker) => {
            const ring = marker.mesh.children[2];
            if (ring && ring.userData.isPulsing) {
              const scale = 1 + Math.sin(Date.now() * 0.003) * 0.3;
              ring.scale.set(scale, scale, scale);
              ring.material.opacity = 0.3 - (scale - 1) * 0.2;
            }
          });

          if (globeGroup) {
            globeGroup.children.forEach((child) => {
              if (child.userData && child.userData.isGlow) {
                child.material.uniforms.viewVector.value = camera.position;
              }
            });
          }

          renderer.render(scene, camera);
        }

        // ==============================================
        // ACEITAR MISSÃO
        // ==============================================
        document
          .getElementById("accept-mission-btn")
          .addEventListener("click", async () => {
            if (!selectedMission) return;
            const btn = document.getElementById("accept-mission-btn");
            const originalText = btn.textContent;
            btn.textContent = "PROCESSANDO...";
            btn.disabled = true;

            try {
              if (!window.ArchiveAPI) {
                alert("ArchiveAPI não disponível.");
                return;
              }
              await window.ArchiveAPI.init();

              const state = window.ArchiveAPI.getState();
              if (!state || !state.director) {
                alert("Você precisa estar cadastrado como Diretor.");
                window.location.href = "/index.html";
                return;
              }

              const result = await window.ArchiveAPI.acceptMission(
                selectedMission.id,
              );

              if (result && result.success) {
                if (
                  window.ArchiveAudio &&
                  typeof window.ArchiveAudio.playSuccess === "function"
                ) {
                  window.ArchiveAudio.playSuccess();
                }
                // 🆕 Passa o ID da missão na URL (para o briefing carregar a correta)
                window.location.href = `/telas-individuais/07-briefing.html?id=${selectedMission.id}`;
              } else {
                if (
                  window.ArchiveAudio &&
                  typeof window.ArchiveAudio.playError === "function"
                ) {
                  window.ArchiveAudio.playError();
                }
                alert(
                  "Erro ao aceitar missão: " +
                    (result?.error || "Falha desconhecida."),
                );
              }
            } catch (err) {
              console.error("[GLOBE] Erro ao aceitar missão:", err);
              alert("Erro de conexão. Tente novamente.");
            } finally {
              btn.textContent = originalText;
              btn.disabled = false;
            }
          });

        init();
      })();
    </script>
  </body>
</html>
