<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE OS — Teia de Evidências</title>
<link href="https://cdn.jsdelivr.net/fontsource/fonts/libre-caslon-text@latest/latin-400-normal.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/manrope@latest/latin-400-normal.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-400-normal.css" rel="stylesheet">
<script src="../api.js"></script>
<script src="../audio-system.js"></script>
<style>
:root{--surface:#131313;--dim:#0e0e0e;--on:#e5e2e1;--onv:#c1c7cc;--gold:#C5A059;--goldl:#e9c176;--bronze:#CD7F32;--amber:#FFBF00;--petrol:#003344;--ivory:#F5F5DC;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--surface);font-family:'Manrope',sans-serif;color:var(--on);}
.web{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;}
.canvas{flex:1;position:relative;overflow:hidden;background-image:linear-gradient(rgba(197,160,89,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(197,160,89,.04) 1px,transparent 1px);background-size:48px 48px;}
.ev{position:absolute;width:232px;background:var(--ivory);cursor:grab;z-index:10;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);}
.ev.drag{cursor:grabbing;}
.detail{width:372px;flex-shrink:0;background:rgba(0,51,68,.16);backdrop-filter:blur(22px);border-left:.5px solid var(--gold);padding:30px 26px;}

@media (max-width: 900px) and (orientation: landscape) {
    .body { flex-direction: row; }
    .detail { width: 250px; padding: 15px; }
}
</style>
</head>
<body>
<div class="web">
  <header style="height:64px;display:flex;align-items:center;padding:0 48px;border-bottom:.5px solid var(--gold);">
    <div class="logo">ARCHIVE</div>
    <div style="flex:1;"></div>
    <button id="bconn">Conectar</button>
  </header>
  <div class="body" style="flex:1;display:flex;overflow:hidden;">
    <div class="canvas" id="cv">
        <!-- Evidências -->
    </div>
    <aside class="detail">
        <div id="dcont">Selecione uma evidência.</div>
    </aside>
  </div>
</div>
<script>
  // Drag & Drop básico
  let dragged = null;
  document.addEventListener('pointerdown', e => {
      if(e.target.closest('.ev')) {
          dragged = e.target.closest('.ev');
          dragged.classList.add('drag');
      }
  });
  document.addEventListener('pointermove', e => {
      if(!dragged) return;
      dragged.style.left = (e.clientX - 100) + 'px';
      dragged.style.top = (e.clientY - 100) + 'px';
  });
  document.addEventListener('pointerup', e => {
      if(dragged) {
          dragged.classList.remove('drag');
          // Verificar conexão (lógica simplificada)
          if(window.ArchiveAudio) ArchiveAudio.playSuccess();
          ArchiveAPI.notify('Conexão estabelecida', 'success');
          dragged = null;
      }
  });
  
  // Carregar dados
  async function loadData() {
      const artifacts = await ArchiveAPI.getArtifacts();
      // Renderizar cards...
  }
  loadData();
</script>
</body>
</html>
